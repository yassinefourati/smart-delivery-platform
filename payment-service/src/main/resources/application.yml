spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DB_USERNAME:sdp}
    password: ${DB_PASSWORD:sdp_local_dev_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Plain JSON strings, not Java-type-headered objects -- see docs/kafka-events.md
    # and PaymentEventPublisher.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  info:
    env:
      enabled: true

info:
  app:
    name: payment-service
    description: Mock payment processing service

# Must match user-service's jwt.secret -- see docs/security.md. Local-dev-only default;
# every non-local environment MUST override this via the JWT_SECRET env var.
jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-key-do-not-use-in-production-min-32-bytes}

# Any charge at or above this amount is deterministically declined by MockPaymentProvider
# -- see its Javadoc. Deliberately high so ordinary test/demo amounts succeed.
payment:
  decline-threshold: ${PAYMENT_DECLINE_THRESHOLD:10000.00}

# How often OutboxPublisher polls outbox_events for PENDING rows -- see ADR 004.
outbox:
  poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:2000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# correlationId (see CorrelationIdFilter) on every log line -- docs/observability.md.
logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

---
# Activated via SPRING_PROFILES_ACTIVE=docker (docker-compose.yml). Structured JSON
# instead of the plain-text pattern above: queryable by a log aggregator, not just
# regex-scraped -- see docs/observability.md. Left off by default so `mvn spring-boot:run`
# and IDE runs stay human-readable.
spring:
  config:
    activate:
      on-profile: docker
logging:
  structured:
    format:
      console: ecs
