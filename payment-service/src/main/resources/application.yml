spring:
  application:
    name: payment-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # This service holds no signing key of any kind -- it fetches user-service's
          # public keys and can only verify (ADR 007, docs/security.md). A token's `kid`
          # header selects the key, so user-service can rotate without a flag day.
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
          # Validated as claims, not used for OIDC discovery: jwk-set-uri above already
          # says where the keys are, so nothing here fetches /.well-known/openid-configuration.
          issuer-uri: ${JWT_ISSUER:https://user-service.smart-delivery.local}
          # Stops a token minted for some other system that happens to trust the same
          # issuer from being replayed against this platform.
          audiences: ${JWT_AUDIENCE:smart-delivery-platform}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DB_USERNAME:sdp}
    password: ${DB_PASSWORD:sdp_local_dev_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Plain JSON strings, not Java-type-headered objects -- see docs/kafka-events.md
    # and PaymentEventPublisher.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  info:
    env:
      enabled: true

info:
  app:
    name: payment-service
    description: Mock payment processing service

# Any charge at or above this amount is deterministically declined by MockPaymentProvider
# -- see its Javadoc. Deliberately high so ordinary test/demo amounts succeed.
payment:
  decline-threshold: ${PAYMENT_DECLINE_THRESHOLD:10000.00}

# The transactional outbox (ADR 004) and its concurrency/retention behavior (ADR 006).
# Every value here is safe to leave alone; they exist so a deployment that publishes far
# more, or far fewer, events than this one can tune without a code change.
outbox:
  # How often OutboxPublisher claims a batch of PENDING rows.
  poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:2000}
  # Rows claimed per poll. Each is sent inside the claiming transaction, so this also
  # bounds how long that transaction holds its row locks -- see OutboxPublisher.
  batch-size: ${OUTBOX_BATCH_SIZE:50}
  # Backoff for a row that fails to publish. Retries stay unbounded (ADR 004); these
  # only stop a poison row from being retried every poll interval forever.
  initial-backoff: ${OUTBOX_INITIAL_BACKOFF:2s}
  max-backoff: ${OUTBOX_MAX_BACKOFF:5m}
  # How long a PUBLISHED row is kept before OutboxCleanupJob deletes it, and how that
  # deletion is paced. PENDING rows are never deleted, whatever their age.
  retention: ${OUTBOX_RETENTION:7d}
  cleanup-interval-ms: ${OUTBOX_CLEANUP_INTERVAL_MS:3600000}
  cleanup-batch-size: ${OUTBOX_CLEANUP_BATCH_SIZE:500}
  cleanup-max-batches-per-run: ${OUTBOX_CLEANUP_MAX_BATCHES_PER_RUN:20}

# This service still generates and serves its own OpenAPI document at /v3/api-docs --
# that is what api-gateway proxies and aggregates. What it no longer serves is a Swagger
# UI of its own: there is one UI for the whole platform, at the gateway, with a dropdown
# to switch between services (docs/api-documentation.md). Six near-identical UIs on six
# ports, each documenting an API you are not supposed to call directly, was six chances
# to read a stale one. Set springdoc.swagger-ui.enabled=true to get it back for local
# debugging against this service's own port.
springdoc:
  swagger-ui:
    enabled: false

# Metadata springdoc cannot infer, bound by platform-starter (ADR 009). public-url is the
# one that matters: it is what Swagger UI's "Try it out" calls, and it has to be the
# gateway -- a document served through the gateway would otherwise advertise this
# service's internal hostname, which resolves to nothing in a browser.
platform:
  openapi:
    title: Payment Service API
    description: Mock payment processing
    version: v1
    public-url: ${PUBLIC_GATEWAY_URL:http://localhost:8080}

# correlationId (see CorrelationIdFilter) on every log line -- docs/observability.md.
logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

---
# Activated via SPRING_PROFILES_ACTIVE=docker (docker-compose.yml). Structured JSON
# instead of the plain-text pattern above: queryable by a log aggregator, not just
# regex-scraped -- see docs/observability.md. Left off by default so `mvn spring-boot:run`
# and IDE runs stay human-readable.
spring:
  config:
    activate:
      on-profile: docker
logging:
  structured:
    format:
      console: ecs
