version: 2
updates:
  # Root pom.xml manages versions for the whole 8-module reactor (see
  # docs/architecture.md's "Build system" section) -- one entry at "/" covers every
  # module's dependencies, not just the root's own.
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # One entry per service Dockerfile -- Dependabot's docker ecosystem only follows the
  # base image(s) in the Dockerfile it's pointed at, not transitively through others.
  - package-ecosystem: "docker"
    directory: "/api-gateway"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/user-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/product-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/inventory-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/order-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/payment-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/delivery-service"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/notification-service"
    schedule:
      interval: "weekly"
