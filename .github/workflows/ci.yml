name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Quality gates live inside `mvn verify` rather than in separate jobs, so that one
# command is the whole gate and a developer running it locally sees exactly what CI sees
# (Phase 18, docs/ci-cd.md): JaCoCo enforces a per-module line-coverage floor measured
# from the real suite, SpotBugs fails on any finding not explicitly justified in
# spotbugs-exclude.xml, and each service's ArchUnit test enforces its layering.

jobs:
  build-and-test:
    name: Build, test & quality gates (Maven reactor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # One command, every gate: compilation, unit tests, Testcontainers integration
      # tests, JaCoCo coverage floors, SpotBugs, and the ArchUnit layering rules.
      - name: Build, test, and enforce quality gates
        run: mvn -B clean verify

      - name: Publish coverage and SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            **/target/site/jacoco/**
            **/target/spotbugsXml.xml
          if-no-files-found: ignore

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.txt'
          if-no-files-found: ignore

  # The React SPA's own gate -- the same four commands frontend/Dockerfile runs, so an image
  # cannot be built from code that fails them. See docs/frontend.md.
  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Test (with coverage floors)
        run: npm run test:coverage

      - name: Build
        run: npm run build

  docker-build:
    name: Docker build (${{ matrix.service }})
    needs: [build-and-test, frontend]
    runs-on: ubuntu-latest
    # Only the publish step needs to write packages; every other step (and every PR
    # build, which never publishes) only needs read access to the checked-out code.
    # id-token: write lets the signing steps obtain this workflow's OIDC identity from
    # GitHub, which is what the keyless signature certifies (Phase 22). A PR build never
    # reaches those steps.
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - user-service
          - product-service
          - inventory-service
          - order-service
          - payment-service
          - delivery-service
          - notification-service
          - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Built and loaded into the local daemon first so Trivy has something to scan.
      # Nothing is published until the scan has passed -- a vulnerable image that is
      # already in the registry is a vulnerable image somebody can pull.
      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          # The Java images build from the repo root (they need the parent POM); the SPA
          # builds from frontend/, and its .dockerignore keeps node_modules out.
          context: ${{ matrix.service == 'frontend' && 'frontend' || '.' }}
          file: ${{ matrix.service }}/Dockerfile
          load: true
          tags: local/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # CRITICAL only, and that is a deliberate line rather than a lazy one: scanning a
      # JRE base image at HIGH on a schedule nobody owns produces a red build every few
      # weeks for something that is not exploitable here and has no fix available, and a
      # gate people learn to ignore is worse than no gate. `ignore-unfixed` is off, so a
      # CRITICAL with no patch yet still fails -- if the base image cannot be fixed, that
      # is a decision to take explicitly, not one to let the scanner make quietly.
      - name: Scan image for CRITICAL vulnerabilities (Trivy)
        # Pinned to a commit, not a tag: a security scanner is the last action whose code
        # should be able to change under a moved tag. v0.36.0 because older releases call
        # aquasecurity/setup-trivy by TAG (v0.28.0 -> setup-trivy@v0.2.1), and those tags
        # no longer exist upstream; v0.36.0 pins setup-trivy by commit. (The original
        # `@0.28.0` never resolved at all -- the tag has a `v` -- which went unnoticed
        # until this job first ran, because the build before it had never gone green.)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ matrix.service }}:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          vuln-type: os,library

      # A PR build (including one from a fork) only needs to prove the image builds and
      # scans clean -- it is never pushed, so it never needs registry credentials. Only a
      # push to main (a merged, reviewed change) publishes.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # github.repository is already all-lowercase for this repo (a GHCR image name
      # requirement) -- see docs/ci-cd.md if this is ever forked under a mixed-case name.
      # Re-runs the same build, which is a cache hit end to end after the step above.
      - name: Publish image (only from a push to main)
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'frontend' && 'frontend' || '.' }}
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # ---- supply chain (Phase 22, ADR 014) -------------------------------------------
      # Sign the pushed DIGEST (never a tag, which can move) keylessly: cosign obtains a
      # short-lived certificate for this workflow's OIDC identity from Sigstore's Fulcio
      # and records the signature in the Rekor transparency log. There is no signing key
      # to leak. deploy/cluster/kyverno/verify-image-signatures.yaml admits only images
      # signed by exactly this workflow on refs/heads/main.
      #
      # cosign 2.x, not 3.x: 3.x defaults to the new Sigstore bundle format, and the
      # admission policy verifies the classic signature format.
      - name: Install cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5

      # An SPDX SBOM of the image as built, attached as a signed attestation, so "which
      # running images contain library X?" is a query rather than an investigation.
      - name: Generate SBOM (SPDX)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ matrix.service }}:ci
          format: spdx-json
          output: sbom.spdx.json
          scan-type: image
          skip-setup-trivy: true

      - name: Sign image and attest SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.service }}@${{ steps.publish.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE"
          cosign verify "$IMAGE" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main" > /dev/null
          echo "signed and attested: $IMAGE"

  compose-config:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose configuration
        run: docker compose config --quiet

  # There is no cluster to deploy to, so none of the Kubernetes artifacts is ever applied
  # -- which makes rot their most likely failure. This job keeps them honest on every
  # push (Phase 20, extended in Phase 22): both charts lint and render in every mode,
  # every object validates against the real Kubernetes AND CRD schemas with nothing
  # skipped, every chart guard is fired on purpose, the alert rules parse, the Kyverno
  # admission policies admit the production render and refuse a :latest / foreign one,
  # and the Falco rules load. It is one script, so a developer runs exactly what CI
  # runs: scripts/validate-k8s.sh. See docs/kubernetes.md and docs/ci-cd.md.
  k8s-manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    env:
      KUBE_VERSION: 1.30.0
      KUBECONFORM_VERSION: v0.6.7
      PROMETHEUS_VERSION: 3.5.0
      LOKI_VERSION: v3.7.8
      KYVERNO_VERSION: v1.19.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      # Pinned versions, downloaded from each project's GitHub releases. yq (v4) and
      # shellcheck are preinstalled on ubuntu-latest.
      - name: Install validators
        run: |
          mkdir -p "$HOME/.local/bin" && cd "$HOME/.local/bin"
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz kubeconform
          curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | tar xz --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          curl -sSfL -o lokitool.zip "https://github.com/grafana/loki/releases/download/${LOKI_VERSION}/lokitool-linux-amd64.zip"
          unzip -q lokitool.zip && mv lokitool-linux-amd64 lokitool && rm lokitool.zip
          curl -sSfL "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz" | tar xz kyverno
          chmod +x kubeconform promtool lokitool kyverno
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate charts, cluster bundle, alert rules and admission policies
        env:
          # The Falco check runs the official image (docker is on the runner).
          RUN_FALCO_CHECK: "1"
        run: ./scripts/validate-k8s.sh

  # The one job that exercises the platform as a platform: eight services started
  # together, finding each other, sharing a broker, carrying an order across process
  # boundaries. Testcontainers proves each service works against real infrastructure;
  # only this proves the system does. See scripts/e2e-smoke.sh and docs/ci-cd.md.
  e2e-smoke:
    name: End-to-end smoke test (Docker Compose)
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run the smoke test
        run: scripts/e2e-smoke.sh

      # The logs are the only way to diagnose a failure that happened inside eight
      # containers that no longer exist, so they are uploaded whether or not it passed.
      - name: Upload Compose logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-compose-logs
          path: target/e2e-logs/**
          if-no-files-found: ignore
