name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Static analysis (Checkstyle/SpotBugs/PMD) is intentionally not wired in yet -- with
# only skeleton applications in the tree there is nothing meaningful for it to check.
# It's added alongside real business logic in an early service-implementation phase,
# not bolted on afterward. Compilation + tests are still a real static/dynamic gate.

jobs:
  build-and-test:
    name: Build & test (Maven reactor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run unit + integration tests
        run: mvn -B clean verify

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.txt'
          if-no-files-found: ignore

  docker-build:
    name: Docker build (${{ matrix.service }})
    needs: build-and-test
    runs-on: ubuntu-latest
    # Only the publish step needs to write packages; every other step (and every PR
    # build, which never publishes) only needs read access to the checked-out code.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - user-service
          - product-service
          - inventory-service
          - order-service
          - payment-service
          - delivery-service
          - notification-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # A PR build (including one from a fork) only needs to prove the image builds --
      # it's never pushed, so it never needs registry credentials. Only a push to main
      # (a merged, reviewed change) publishes.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # github.repository is already all-lowercase for this repo (a GHCR image name
      # requirement) -- see docs/ci-cd.md if this is ever forked under a mixed-case name.
      - name: Build image (published only from a push to main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  compose-config:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose configuration
        run: docker compose config --quiet
