# =============================================================================
# The one path from AWS Secrets Manager into the cluster (Phase 22).
#
# Auth is IRSA: the ESO controller's service account assumes an IAM role whose
# policy allows secretsmanager:GetSecretValue/DescribeSecret on arn:...:secret:prod/sdp/*
# and nothing else. No static AWS key exists anywhere.
#
# `conditions` limits which namespaces may reference this store at all: an
# ExternalSecret created in any other namespace is refused, so namespace-admin
# somewhere else in the cluster is not a way to read our database passwords.
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: REPLACE_ME_AWS_REGION
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
  conditions:
    - namespaces:
        - sdp
        - sdp-data
