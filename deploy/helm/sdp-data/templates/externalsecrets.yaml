{{/*
The two role passwords per cluster, from the secret manager, as the basic-auth Secrets
CNPG consumes (initdb's owner secret and managed.roles[].passwordSecret).

The SAME secret-manager keys feed the application's Secrets (the app chart's
externalSecrets in values-production.yaml), so a rotation is one write to the secret
manager: ESO updates both Secrets, CNPG runs the ALTER ROLE, and a rollout restart
makes the pods pick up the new password.

The username is templated from values, not read from the secret manager: the role name
is a schema fact, and CNPG requires the Secret's username to equal it. The one read by
the application from the secret manager must match (values.yaml says so).

Not rendered in mode=replica until promotion: a replica cluster has no roles of its own
to manage; they arrive through the WAL.
*/}}
{{- $writable := or (eq .Values.mode "primary") .Values.dr.promoted }}
{{- if $writable }}
{{- $root := . }}
{{- $es := .Values.externalSecrets }}
{{- range $name, $cfg := .Values.clusters }}
{{- if $cfg.enabled }}
{{- range $pair := list (list (include "sdpdata.ownerSecret" (dict "name" $name)) $cfg.ownerRole $es.ownerKey) (list (include "sdpdata.appSecret" (dict "name" $name)) $cfg.appRole $es.appKey) }}
---
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ index $pair 0 }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "sdpdata.labels" (dict "root" $root "name" $name) | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.storeRef.kind }}
    name: {{ $es.storeRef.name }}
  target:
    name: {{ index $pair 0 }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: {{ index $pair 1 | quote }}
        password: "{{ "{{" }} .password {{ "}}" }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ printf "%s/%s" $cfg.secretPrefix (index $pair 2) }}
        property: password
{{- end }}
{{- end }}
{{- end }}
{{- end }}
