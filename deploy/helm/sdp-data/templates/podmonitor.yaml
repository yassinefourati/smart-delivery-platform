{{/*
One PodMonitor per cluster, scraping each instance's exporter (:9187, "metrics").
Written here rather than via spec.monitoring.enablePodMonitor for one reason: the
`cluster` label. CNPG's metrics carry the pod name but not the cluster name, and every
alert in prometheusrule.yaml groups by cluster.
*/}}
{{- if .Values.monitoring.podMonitor.enabled }}
{{- $root := . }}
{{- range $name, $cfg := .Values.clusters }}
{{- if $cfg.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "sdpdata.labels" (dict "root" $root "name" $name) | nindent 4 }}
    {{- with $root.Values.monitoring.podMonitor.extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ $name }}
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
          targetLabel: cluster
        - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_instanceRole]
          targetLabel: role
{{- end }}
{{- end }}
{{- end }}
