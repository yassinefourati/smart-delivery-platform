{{/*
================================================================================
ExternalSecrets (Phase 22). Off by default; needs the External Secrets Operator
and a (Cluster)SecretStore -- deploy/cluster/external-secrets/ has one for AWS
Secrets Manager via IRSA.

Each entry becomes an ExternalSecret whose target is an ordinary Secret with the
SAME name the services' secretEnv already reference, so nothing else in the chart
changes: the pods do not know, and must not know, where a value came from. The
source of truth moves out of the cluster into a secret manager with its own audit
log, rotation and access policy; etcd holds a synced copy.

Mutually exclusive with secrets.create (the placeholder Secrets): two writers for
one Secret would fight on every refresh. The chart refuses that combination.
================================================================================
*/}}
{{- if .Values.externalSecrets.enabled }}
{{- $root := . }}
{{- $es := .Values.externalSecrets }}
{{- range $secretName, $keys := $es.secrets }}
---
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "sdp.labels" (dict "root" $root "name" $secretName) | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.storeRef.kind }}
    name: {{ $es.storeRef.name }}
  target:
    name: {{ $secretName }}
    # Owner: deleting the ExternalSecret deletes the synced Secret with it, so a
    # removed credential does not linger in etcd.
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $key, $ref := $keys }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ required (printf "externalSecrets.secrets.%s.%s.key is required" $secretName $key) $ref.key }}
        {{- with $ref.property }}
        property: {{ . }}
        {{- end }}
        {{- with $ref.version }}
        version: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
