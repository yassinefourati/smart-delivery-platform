{{/*
================================================================================
PLACEHOLDER SECRETS. Rendered only when secrets.create is true, which is NOT the
default, and every value in them is the literal string REPLACE_ME__something.

This object exists to show the shape of what has to exist, and to let
`helm template` prove the wiring end to end without a cluster. It cannot make the
platform work: Postgres will reject REPLACE_ME__NOT_A_REAL_PASSWORD, and
JwtKeyProvider will throw on a PEM that is not one -- which is the correct
outcome. A service that cannot sign or verify tokens must fail to start rather
than start and mint garbage (that behaviour is deliberate; see the
CT_CONSTRUCTOR_THROW justification in spotbugs-exclude.xml).

THERE IS NO REAL CREDENTIAL IN THIS CHART AND THERE MUST NEVER BE ONE.
docs/security.md's "there is no signing key in this repository at all" stops
being true the moment somebody edits a placeholder in place instead of creating
the Secret out of band. NOTES.txt prints the commands; prefer --from-file over
--from-literal, because a literal lands in the shell history.

What a Kubernetes Secret actually is: base64. `echo <value> | base64 -d` is the
whole protection. Anyone with `get secrets` in this namespace has every plaintext
and so does anyone with an etcd backup, so RBAC is the real control; Secrets are
encrypted at rest only if the API server has an EncryptionConfiguration, which
several distributions ship without; and a Secret injected as an env var is
readable from /proc/1/environ inside that container. The realistic next steps, in
order of cost: encryption at rest with a KMS provider (cheapest real improvement,
zero manifest change), then External Secrets Operator against a real secret
manager (which still produces an ordinary Secret, so nothing in this chart
changes), then Vault dynamic Postgres credentials, whose real prize is database
passwords that expire.
================================================================================
*/}}
{{- if .Values.secrets.create }}
{{- $root := . }}
{{- range $secretName, $data := default (dict) .Values.secrets.placeholders }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "sdp.labels" (dict "root" $root "name" $secretName) | nindent 4 }}
  annotations:
    # Machine-readable, so a policy engine or a pre-flight script can refuse to
    # let this reach anything real.
    sdp.dev/placeholder-only: "true"
type: Opaque
stringData:
{{- range $key, $value := $data }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
{{- end }}
