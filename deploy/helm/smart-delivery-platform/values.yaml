  # ---------------------------------------------------------------------------
  notification-service:
    enabled: true
    # A web port with no web API. notification-service has
    # spring-boot-starter-web for Actuator only -- no controllers, no database
    # (no spring-boot-starter-data-jpa, no postgresql driver) -- so its Service
    # exists PURELY to be scraped: a role: endpoints ServiceMonitor has nothing to
    # select without one, and skipping it removes this service from all 15
    # dashboard panels silently. Easy to think it does not need one.
    port: 8087
    runtime: servlet
    ownsSchema: false
    hasOutbox: false
    hasKafkaListeners: true
    replicaCount: 1
    image:
      name: ""
      tag: ""
    service:
      type: ClusterIP
      annotations: {}
    # The only service where one processor is honest: its entire job is to
    # deserialize JSON and write a log line, across twelve listener containers.
    # It also gets SerialGC in its Dockerfile for the same reason -- one thread is
    # cheaper than G1's region bookkeeping when a 30ms pause is invisible -- and
    # that choice is written down there precisely so a second CPU does not
    # silently flip the collector back.
    activeProcessorCount: 1
    # Passed as SHUTDOWN_PHASE_TIMEOUT, which this service's application.yml reads
    # into spring.lifecycle.timeout-per-shutdown-phase. Sized on the request drain,
    # the only phase with legitimately long in-flight work.
    shutdownPhaseTimeoutSeconds: 20
    # = preStopSleepSeconds + 2 x shutdownPhaseTimeoutSeconds. The chart fails the
    # render if it is less than that, because the three numbers are one decision.
    terminationGracePeriodSeconds: 45
    # 0 = no SCHEDULER_POOL_SIZE is emitted. This service carries no
    # @EnableScheduling, and TaskSchedulingAutoConfiguration is conditional on the
    # scheduled-annotation processor bean, so there is no scheduler here for the
    # property to configure -- and config that cannot do anything is worse than
    # config that is absent. Stated as a 0 rather than left out so the absence is
    # visibly a decision.
    schedulerPoolSize: 0
    preStopSleepSeconds: 5
    managementPort: 0
    probes:
      startup:
        # No Flyway and no schema here, so this is a JVM-boot budget: 24 x 5s.
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 24
        # A container that never finished starting has no in-flight work worth
        # draining -- and if a startupProbe is failing, whatever is wrong is
        # upstream of the request pipeline anyway -- so the pod-level budget is pure
        # delay before the restart. Same probe-level override (Kubernetes 1.25+) as
        # the liveness probe below.
        terminationGracePeriodSeconds: 10
      readiness:
        # There is no Service in front of this for readiness to remove it from --
        # nothing calls it, it only consumes. The probe still earns its place: it
        # is what a rolling update waits on before replacing the next pod.
        #
        # And be clear about what these probes do NOT tell you. There is no Kafka
        # health indicator on this classpath (Spring Boot ships none for Kafka,
        # and plain spring-kafka contributes none), so this service reports UP
        # whether or not it is consuming anything -- which is its only job. Adding
        # one would be the wrong fix anyway: a broker outage is shared, so it
        # would unready or restart every consumer at once. Consumer lag belongs on
        # a metric and an alert.
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 3
        successThreshold: 1
      liveness:
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 6
        terminationGracePeriodSeconds: 10
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
        ephemeral-storage: 256Mi
      limits:
        memory: 512Mi
        ephemeral-storage: 1Gi
    config: {}
    # No credential of any kind: no database, no JWT, no service client.
    secretEnv: []
    extraEnv: []
    autoscaling:
      # Same one-partition ceiling as order-service, and more sharply: a second
      # replica of a single-partition consumer group does nothing at all.
      enabled: false
