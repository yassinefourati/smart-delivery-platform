spring:
  application:
    name: product-service
  # Kubernetes readiness (Phase 20). Each setting states its reason in a line; the
  # full argument is docs/kubernetes.md and docs/adr/010-probe-and-lifecycle-contract.md.
  lifecycle:
    # Bounds EACH shutdown phase, not the total. The pod's terminationGracePeriodSeconds
    # must cover preStop + 2 x this, and the Helm chart refuses to render if it does not.
    timeout-per-shutdown-phase: ${SHUTDOWN_PHASE_TIMEOUT:20s}
  security:
    oauth2:
      resourceserver:
        jwt:
          # This service holds no signing key of any kind -- it fetches user-service's
          # public keys and can only verify (ADR 007, docs/security.md). A token's `kid`
          # header selects the key, so user-service can rotate without a flag day.
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
          # Validated as claims, not used for OIDC discovery: jwk-set-uri above already
          # says where the keys are, so nothing here fetches /.well-known/openid-configuration.
          issuer-uri: ${JWT_ISSUER:https://user-service.smart-delivery.local}
          # Stops a token minted for some other system that happens to trust the same
          # issuer from being replayed against this platform.
          audiences: ${JWT_AUDIENCE:smart-delivery-platform}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/product_db}
    username: ${DB_USERNAME:sdp}
    password: ${DB_PASSWORD:sdp_local_dev_only}
    # Both Hikari defaults are wrong for a pod. A 30s connection-timeout parks the same
    # request threads that serve the probes -- a restart storm even with db out of the
    # probe groups -- and 10 x 6 services x 2 replicas exceeds Postgres's 100 connections.
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:2000}
      maximum-pool-size: ${DB_POOL_MAX:5}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Migrations may run as a separate, schema-owning role while the application
    # runs as a DML-only one (deploy/helm/sdp-data, docs/security-hardening.md), so a
    # compromised pod cannot DROP or ALTER what it serves. Both default to the
    # runtime credentials, so nothing changes until DB_MIGRATION_* are set.
    user: ${DB_MIGRATION_USERNAME:${spring.datasource.username}}
    password: ${DB_MIGRATION_PASSWORD:${spring.datasource.password}}
    # Kubernetes has no depends_on, so a pod scheduled before Postgres is up would
    # crash-loop. The interval must be set with the count: Boot's default is 120s.
    connect-retries: ${FLYWAY_CONNECT_RETRIES:10}
    connect-retries-interval: ${FLYWAY_CONNECT_RETRIES_INTERVAL:5s}
    # Flyway's own default, stated because it is a cliff: replicas waiting on another's
    # migration give up after ~50s. Raise it before any migration that could run longer.
    lock-retry-count: ${FLYWAY_LOCK_RETRY_COUNT:50}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis

server:
  port: 8082
  # Boot 3.5's default already; stated because the grace-period arithmetic depends on it.
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      # Two probe groups for the kubelet, with no shared dependency in either (ADR 010).
      # /actuator/health is unchanged and still aggregates db, Kafka and Redis.
      probes:
        enabled: true
      group:
        # Liveness: is this JVM wedged? Never Postgres, Kafka or Redis -- a shared outage
        # must not restart every replica at once.
        liveness:
          include: livenessState
        # Readiness: can this instance take traffic? Shared dependencies are deliberately
        # excluded; ADR 010 records which failure that choice accepts.
        readiness:
          include: readinessState
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  info:
    env:
      enabled: true

info:
  app:
    name: product-service
    description: Product and category catalog service

# This service still generates and serves its own OpenAPI document at /v3/api-docs --
# that is what api-gateway proxies and aggregates. What it no longer serves is a Swagger
# UI of its own: there is one UI for the whole platform, at the gateway, with a dropdown
# to switch between services (docs/api-documentation.md). Six near-identical UIs on six
# ports, each documenting an API you are not supposed to call directly, was six chances
# to read a stale one. Set springdoc.swagger-ui.enabled=true to get it back for local
# debugging against this service's own port.
springdoc:
  swagger-ui:
    enabled: false

# Metadata springdoc cannot infer, bound by platform-starter (ADR 009). public-url is the
# one that matters: it is what Swagger UI's "Try it out" calls, and it has to be the
# gateway -- a document served through the gateway would otherwise advertise this
# service's internal hostname, which resolves to nothing in a browser.
platform:
  openapi:
    title: Product Service API
    description: Product catalog, categories, search, and pagination
    version: v1
    public-url: ${PUBLIC_GATEWAY_URL:http://localhost:8080}

# correlationId (see CorrelationIdFilter) on every log line -- docs/observability.md.
logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

---
# Activated via SPRING_PROFILES_ACTIVE=docker (docker-compose.yml). Structured JSON
# instead of the plain-text pattern above: queryable by a log aggregator, not just
# regex-scraped -- see docs/observability.md. Left off by default so `mvn spring-boot:run`
# and IDE runs stay human-readable.
spring:
  config:
    activate:
      on-profile: docker
logging:
  structured:
    format:
      console: ecs
