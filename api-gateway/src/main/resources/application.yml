spring:
  application:
    name: api-gateway
  # Kubernetes readiness (Phase 20). Each setting states its reason in a line; the
  # full argument is docs/kubernetes.md and docs/adr/010-probe-and-lifecycle-contract.md.
  lifecycle:
    # Bounds EACH shutdown phase, not the total. The pod's terminationGracePeriodSeconds
    # must cover preStop + 2 x this, and the Helm chart refuses to render if it does not.
    timeout-per-shutdown-phase: ${SHUTDOWN_PHASE_TIMEOUT:15s}
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 5s
            # Bound idle and lifetime so the gateway never writes a request onto a pooled
            # connection to a pod that is shutting down; Reactor Netty leaves both unbounded.
            pool:
              max-idle-time: ${GATEWAY_POOL_MAX_IDLE_TIME:8s}
              max-life-time: ${GATEWAY_POOL_MAX_LIFE_TIME:60s}
              eviction-interval: ${GATEWAY_POOL_EVICTION_INTERVAL:2s}
          routes:
            - id: user-service
              # /.well-known/jwks.json is routed here too (ADR 007): it is a public
              # endpoint by design -- a JWKS holds public keys only -- and clients that
              # reach the platform only through the gateway need a way to see it.
              uri: ${USER_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/users/**,/api/v1/auth/**,/.well-known/jwks.json
            - id: product-service
              uri: ${PRODUCT_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/products/**,/api/v1/categories/**
            - id: inventory-service
              # /api/v1/warehouses/** was missing until Phase 18 -- found the first time
              # anything drove the platform end to end through the gateway, which is what
              # scripts/e2e-smoke.sh now does on every CI run. Warehouse management was
              # simply unreachable for any client that went through the front door.
              uri: ${INVENTORY_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/inventory/**,/api/v1/warehouses/**
            - id: order-service
              uri: ${ORDER_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/orders/**
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URI:http://localhost:8085}
              predicates:
                - Path=/api/v1/payments/**
            - id: delivery-service
              uri: ${DELIVERY_SERVICE_URI:http://localhost:8086}
              predicates:
                - Path=/api/v1/agents/**,/api/v1/shipments/**,/api/v1/deliveries/**

            # --- Aggregated API documentation (docs/api-documentation.md) ---------------
            # One route per service, each rewriting /v3/api-docs/<service> to that
            # service's own /v3/api-docs. The single Swagger UI below lists them all, so a
            # reader browses the whole platform's API from one page and one origin -- and
            # never has to know, or be able to reach, a service's own port.
            #
            # These are EXACT paths, not /v3/api-docs/**, and that is deliberate: Swagger
            # UI fetches its own settings from /v3/api-docs/swagger-config, which springdoc
            # serves from the gateway itself. A wildcard here would swallow that request
            # and route it to user-service, and the UI would come up empty with nothing in
            # the log to say why.
            - id: user-service-api-docs
              uri: ${USER_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/v3/api-docs/user-service
              filters:
                - SetPath=/v3/api-docs
            - id: product-service-api-docs
              uri: ${PRODUCT_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/v3/api-docs/product-service
              filters:
                - SetPath=/v3/api-docs
            - id: inventory-service-api-docs
              uri: ${INVENTORY_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/v3/api-docs/inventory-service
              filters:
                - SetPath=/v3/api-docs
            - id: order-service-api-docs
              uri: ${ORDER_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/v3/api-docs/order-service
              filters:
                - SetPath=/v3/api-docs
            - id: payment-service-api-docs
              uri: ${PAYMENT_SERVICE_URI:http://localhost:8085}
              predicates:
                - Path=/v3/api-docs/payment-service
              filters:
                - SetPath=/v3/api-docs
            - id: delivery-service-api-docs
              uri: ${DELIVERY_SERVICE_URI:http://localhost:8086}
              predicates:
                - Path=/v3/api-docs/delivery-service
              filters:
                - SetPath=/v3/api-docs

server:
  port: 8080
  # Boot 3.5's default already; stated because the grace-period arithmetic depends on it.
  shutdown: graceful

# One Swagger UI for the whole platform, at http://localhost:8080/swagger-ui.html, with a
# dropdown to switch between services -- see docs/api-documentation.md. Each service still
# generates its own document; this only collects them, which keeps the aggregation honest
# (nothing is hand-maintained here that could drift from a service's real API).
#
# The urls are relative, so the browser fetches them from the gateway's own origin and
# there is no CORS configuration to get wrong. Each resolves to a route above.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # springdoc sorts the dropdown alphabetically whatever order these are written in,
    # so the entry point is named explicitly instead: user-service is where a reader has
    # to start, because everything else needs a token from it.
    urls-primary-name: user-service
    urls:
      - name: user-service
        url: /v3/api-docs/user-service
      - name: product-service
        url: /v3/api-docs/product-service
      - name: inventory-service
        url: /v3/api-docs/inventory-service
      - name: order-service
        url: /v3/api-docs/order-service
      - name: payment-service
        url: /v3/api-docs/payment-service
      - name: delivery-service
        url: /v3/api-docs/delivery-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway,prometheus
  endpoint:
    health:
      show-details: when-authorized
      # Two probe groups for the kubelet, with no shared dependency in either (ADR 010).
      # /actuator/health is unchanged and still aggregates db, Kafka and Redis.
      probes:
        enabled: true
      group:
        # Liveness: is this JVM wedged? Never Postgres, Kafka or Redis -- a shared outage
        # must not restart every replica at once.
        liveness:
          include: livenessState
        readiness:
          # Readiness: can this instance take traffic? Shared dependencies are deliberately
          # excluded; ADR 010 records which failure that choice accepts.
          include: readinessState
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

info:
  app:
    name: api-gateway
    description: Edge API Gateway routing client traffic to backend microservices

# NOTE: routing is static (Docker Compose DNS / env-var overrides) for this stage of the
# platform. There is no service registry (Eureka/Consul) yet -- introducing one is only
# justified once we run multiple instances per service and need client-side load balancing.
# See docs/architecture.md for the rationale.

# NOTE: no `logging.pattern.level` MDC placeholder here, unlike every backend service --
# WebFlux doesn't run a request on one dedicated thread the way a blocking Servlet
# service does, so a plain MDC.put() in CorrelationIdGlobalFilter wouldn't reliably
# still be visible by the time a later log statement runs on a different Reactor
# thread. CorrelationIdGlobalFilter logs the id directly instead -- see its Javadoc.
---
# Activated via SPRING_PROFILES_ACTIVE=docker (docker-compose.yml). Structured JSON
# for log output -- queryable by a log aggregator, not just regex-scraped -- see
# docs/observability.md. Left off by default so `mvn spring-boot:run` and IDE runs stay
# human-readable.
spring:
  config:
    activate:
      on-profile: docker
logging:
  structured:
    format:
      console: ecs
