spring:
  application:
    name: notification-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Plain JSON strings, not Java-type-headered objects -- see docs/kafka-events.md
    # and NotificationEventListener.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: notification-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

server:
  port: 8087

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  info:
    env:
      enabled: true

info:
  app:
    name: notification-service
    description: Event-driven customer notification service

# correlationId (see NotificationEventListener's MDC handling) on every log line --
# docs/observability.md.
logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

---
# Activated via SPRING_PROFILES_ACTIVE=docker (docker-compose.yml). Structured JSON
# instead of the plain-text pattern above: queryable by a log aggregator, not just
# regex-scraped -- see docs/observability.md. Left off by default so `mvn spring-boot:run`
# and IDE runs stay human-readable.
spring:
  config:
    activate:
      on-profile: docker
logging:
  structured:
    format:
      console: ecs
