spring:
  application:
    name: notification-service
  # Kubernetes readiness (Phase 20). Each setting states its reason in a line; the
  # full argument is docs/kubernetes.md and docs/adr/010-probe-and-lifecycle-contract.md.
  lifecycle:
    # Bounds EACH shutdown phase, not the total. The pod's terminationGracePeriodSeconds
    # must cover preStop + 2 x this, and the Helm chart refuses to render if it does not.
    timeout-per-shutdown-phase: ${SHUTDOWN_PHASE_TIMEOUT:20s}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Plain JSON strings, not Java-type-headered objects -- see docs/kafka-events.md
    # and NotificationEventListener.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: notification-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      # On shutdown, stop after the current record instead of draining up to 500. The rest
      # are redelivered -- safe (idempotent consumers, ADR 002), but more duplicates per deploy.
      immediate-stop: true
      # Consumer threads per listener in this pod (Phase 23, ADR 015). A group gets at most
      # one active consumer per partition, so pods x concurrency above the topic's partition
      # count (kafka.topics.partitions) only adds idle threads. 1 here, raised by Compose and
      # the Helm chart; each thread is a Kafka consumer and, while it handles a record, a
      # database connection -- keep it within database.poolMax.
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:1}

server:
  port: 8087
  # Boot 3.5's default already; stated because the grace-period arithmetic depends on it.
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      # Two probe groups for the kubelet, with no shared dependency in either (ADR 010).
      # /actuator/health is unchanged and still aggregates db, Kafka and Redis.
      probes:
        enabled: true
      group:
        # Liveness: is this JVM wedged? Never Postgres, Kafka or Redis -- a shared outage
        # must not restart every replica at once.
        liveness:
          include: livenessState
        # Readiness: can this instance take traffic? Shared dependencies are deliberately
        # excluded; ADR 010 records which failure that choice accepts.
        readiness:
          include: readinessState
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  info:
    env:
      enabled: true

info:
  app:
    name: notification-service
    description: Event-driven customer notification service

# correlationId (see NotificationEventListener's MDC handling) on every log line --
# docs/observability.md.
logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

---
# Activated via SPRING_PROFILES_ACTIVE=docker (docker-compose.yml). Structured JSON
# instead of the plain-text pattern above: queryable by a log aggregator, not just
# regex-scraped -- see docs/observability.md. Left off by default so `mvn spring-boot:run`
# and IDE runs stay human-readable.
spring:
  config:
    activate:
      on-profile: docker
logging:
  structured:
    format:
      console: ecs
