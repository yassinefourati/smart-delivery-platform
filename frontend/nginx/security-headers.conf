# The one place the browser security policy is written down (index.html deliberately has no
# meta CSP -- see the comment there).
#
# connect-src 'self' is possible only because the API is same-origin. img-src has no https:
# widening because the storefront renders no remote images (ProductArt.tsx), so the policy
# and the UI agree. No 'unsafe-inline' anywhere: Vite emits no inline script, and React sets
# style properties through the CSSOM, which style-src does not govern.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
