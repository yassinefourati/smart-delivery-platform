# The SPA's static server. docs/frontend.md#production-topology explains the design; the
# short version of each non-obvious line is beside it.
#
# Runs as UID 1000 on a READ-ONLY root filesystem (the Helm chart's pod contract), so every
# path nginx writes is under /tmp, and it listens on 8080 because an unprivileged process
# cannot bind 80.

worker_processes auto;
pid /tmp/nginx.pid;
# `stderr`, not /dev/stderr: the keyword writes to the inherited file descriptor, while the
# path has to be OPENED -- which fails with EACCES for a non-root process whenever the
# stdio pipe or TTY belongs to another user.
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # No access log, for the same open() reason (nginx has no fd keyword for it). Nothing
    # is lost that matters: every API call is logged by the gateway with its correlation
    # id, and a log of which static chunks were fetched is volume, not insight.
    access_log off;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        # Same-origin API routing, when this server is the front door (docker compose). Under
        # Kubernetes the Ingress routes /api before a request ever reaches this pod, so the
        # image ships with nothing here and compose mounts gateway-proxy.conf into this
        # directory. A glob that matches nothing is not an error.
        include /etc/nginx/sdp/*.conf;

        # Vite content-hashes every file under /assets/, so a changed file is a new URL and
        # these can be cached forever. `add_header` in a location REPLACES the server-level
        # set, which is why every location includes the security headers itself.
        # No `always` on Cache-Control: a 404 for a missing chunk must NOT be cached for a year.
        location /assets/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location = /favicon.ico {
            log_not_found off;
            return 204;
        }

        # index.html is never cached, so a deploy is picked up on the next navigation instead
        # of a stale document pointing at chunk hashes that no longer exist.
        location = /index.html {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
        }

        # The history fallback: /orders/123 has no file, and the client-side router owns it.
        # Forgetting this is the classic works-in-dev, 404s-on-reload bug; the smoke test
        # asserts it.
        location / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
            try_files $uri /index.html;
        }
    }
}
