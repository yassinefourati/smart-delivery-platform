# Mounted by docker-compose.yml only: makes this nginx the single origin for the SPA and the
# API, which is what lets the app use relative URLs, connect-src 'self', and no CORS at all.
#
# read_timeout 30s is deliberately LONGER than the gateway's own 5s response timeout, so a
# slow backend surfaces as the gateway's problem+json (which carries a correlation id) rather
# than as a bare nginx 504.
#
# X-Correlation-Id is deliberately NOT set here: the browser sends one, the gateway honours
# whatever arrives, and overwriting it would break the join between the support code a user
# reads and the log lines it should find.
#
# /actuator is deliberately NOT proxied: it is not client surface.

location /api/ {
    proxy_pass http://api-gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

location /.well-known/ {
    proxy_pass http://api-gateway:8080;
    proxy_set_header Host $host;
}
