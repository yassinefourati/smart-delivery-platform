spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/user_db}
    username: ${DB_USERNAME:sdp}
    password: ${DB_PASSWORD:sdp_local_dev_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  info:
    env:
      enabled: true

info:
  app:
    name: user-service
    description: User, authentication, roles and address management service

# user-service is the only service in the platform that holds a signing key; everyone
# else fetches the public half from /.well-known/jwks.json -- see ADR 007 and
# docs/security.md.
jwt:
  # Validated by every resource server as the `iss` and `aud` claims. Identifiers, not
  # URLs that have to resolve -- the JWKS location is configured separately, per service.
  issuer: ${JWT_ISSUER:https://user-service.smart-delivery.local}
  audience: ${JWT_AUDIENCE:smart-delivery-platform}
  expiration: ${JWT_EXPIRATION:1h}
  # Service tokens are fetched on demand by a process that can always fetch another, so
  # there is no reason to hand out a long-lived one.
  service-expiration: ${JWT_SERVICE_EXPIRATION:5m}
  signing-key:
    # Stamped into every token's `kid` header so a resource server can pick the right
    # JWKS entry -- and so this key can be rotated without invalidating tokens signed by
    # its predecessor. See jwt.retired-keys below.
    kid: ${JWT_SIGNING_KID:sdp-dev-key-1}
    # A PKCS#8 PEM, from an env var or a mounted file. LEFT EMPTY ON PURPOSE for local
    # development: JwtKeyProvider then generates a throwaway RSA key pair at startup and
    # logs a warning saying so. That is fine on one laptop and wrong everywhere else --
    # tokens die with the process, and two replicas would sign with different keys. Set
    # JWT_PRIVATE_KEY in any real environment.
    private-key: ${JWT_PRIVATE_KEY:}
    # Optional: derived from the private key when omitted, which is the normal case.
    public-key: ${JWT_PUBLIC_KEY:}
  # Public keys of previously-active signing keys, still published in the JWKS so tokens
  # they signed keep verifying. Rotation is: add the new key as signing-key, move the old
  # one here, and drop it once nothing signed by it can still be unexpired.
  retired-keys: []
  # One credential per calling service for POST /api/v1/auth/service-token, so a leak is
  # scoped to that service rather than to the whole platform. Local-dev defaults; every
  # non-local environment MUST override them.
  service-clients:
    order-service: ${ORDER_SERVICE_CLIENT_SECRET:local-dev-only-order-service-secret}

# NOTE: bootstrap.admin.email / bootstrap.admin.password are deliberately NOT declared
# here. Setting both (as BOOTSTRAP_ADMIN_EMAIL / BOOTSTRAP_ADMIN_PASSWORD env vars, which
# Spring binds to those names) is the opt-in that creates a startup ADMIN account; a
# declaration with an empty default would make the property *present but blank*, which
# @ConditionalOnProperty treats as set. docker-compose.yml supplies them for the local
# stack and the end-to-end smoke test. See BootstrapAdminInitializer and docs/security.md.

# This service still generates and serves its own OpenAPI document at /v3/api-docs --
# that is what api-gateway proxies and aggregates. What it no longer serves is a Swagger
# UI of its own: there is one UI for the whole platform, at the gateway, with a dropdown
# to switch between services (docs/api-documentation.md). Six near-identical UIs on six
# ports, each documenting an API you are not supposed to call directly, was six chances
# to read a stale one. Set springdoc.swagger-ui.enabled=true to get it back for local
# debugging against this service's own port.
springdoc:
  swagger-ui:
    enabled: false

# Metadata springdoc cannot infer, bound by platform-starter (ADR 009). public-url is the
# one that matters: it is what Swagger UI's "Try it out" calls, and it has to be the
# gateway -- a document served through the gateway would otherwise advertise this
# service's internal hostname, which resolves to nothing in a browser.
platform:
  openapi:
    title: User Service API
    description: Registration, authentication, profile, and address management
    version: v1
    public-url: ${PUBLIC_GATEWAY_URL:http://localhost:8080}

# correlationId (see CorrelationIdFilter) on every log line -- docs/observability.md.
logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

---
# Activated via SPRING_PROFILES_ACTIVE=docker (docker-compose.yml). Structured JSON
# instead of the plain-text pattern above: queryable by a log aggregator, not just
# regex-scraped -- see docs/observability.md. Left off by default so `mvn spring-boot:run`
# and IDE runs stay human-readable.
spring:
  config:
    activate:
      on-profile: docker
logging:
  structured:
    format:
      console: ecs
