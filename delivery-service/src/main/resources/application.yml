spring:
  application:
    name: delivery-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/delivery_db}
    username: ${DB_USERNAME:sdp}
    password: ${DB_PASSWORD:sdp_local_dev_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Plain JSON strings, not Java-type-headered objects -- see docs/kafka-events.md
    # and DeliveryEventPublisher/PaymentCompletedListener.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: delivery-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  info:
    env:
      enabled: true

info:
  app:
    name: delivery-service
    description: Shipment and delivery agent management service

# Must match user-service's jwt.secret -- see docs/security.md. Local-dev-only default;
# every non-local environment MUST override this via the JWT_SECRET env var.
jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-key-do-not-use-in-production-min-32-bytes}

# The transactional outbox (ADR 004) and its concurrency/retention behavior (ADR 006).
# Every value here is safe to leave alone; they exist so a deployment that publishes far
# more, or far fewer, events than this one can tune without a code change.
outbox:
  # How often OutboxPublisher claims a batch of PENDING rows.
  poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:2000}
  # Rows claimed per poll. Each is sent inside the claiming transaction, so this also
  # bounds how long that transaction holds its row locks -- see OutboxPublisher.
  batch-size: ${OUTBOX_BATCH_SIZE:50}
  # Backoff for a row that fails to publish. Retries stay unbounded (ADR 004); these
  # only stop a poison row from being retried every poll interval forever.
  initial-backoff: ${OUTBOX_INITIAL_BACKOFF:2s}
  max-backoff: ${OUTBOX_MAX_BACKOFF:5m}
  # How long a PUBLISHED row is kept before OutboxCleanupJob deletes it, and how that
  # deletion is paced. PENDING rows are never deleted, whatever their age.
  retention: ${OUTBOX_RETENTION:7d}
  cleanup-interval-ms: ${OUTBOX_CLEANUP_INTERVAL_MS:3600000}
  cleanup-batch-size: ${OUTBOX_CLEANUP_BATCH_SIZE:500}
  cleanup-max-batches-per-run: ${OUTBOX_CLEANUP_MAX_BATCHES_PER_RUN:20}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# correlationId (see CorrelationIdFilter) on every log line -- docs/observability.md.
logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

---
# Activated via SPRING_PROFILES_ACTIVE=docker (docker-compose.yml). Structured JSON
# instead of the plain-text pattern above: queryable by a log aggregator, not just
# regex-scraped -- see docs/observability.md. Left off by default so `mvn spring-boot:run`
# and IDE runs stay human-readable.
spring:
  config:
    activate:
      on-profile: docker
logging:
  structured:
    format:
      console: ecs
