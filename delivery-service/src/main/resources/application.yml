spring:
  application:
    name: delivery-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/delivery_db}
    username: ${DB_USERNAME:sdp}
    password: ${DB_PASSWORD:sdp_local_dev_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Plain JSON strings, not Java-type-headered objects -- see docs/kafka-events.md
    # and DeliveryEventPublisher/PaymentCompletedListener.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: delivery-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: delivery-service
    description: Shipment and delivery agent management service

# Must match user-service's jwt.secret -- see docs/security.md. Local-dev-only default;
# every non-local environment MUST override this via the JWT_SECRET env var.
jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-key-do-not-use-in-production-min-32-bytes}

# How often OutboxPublisher polls outbox_events for PENDING rows -- see ADR 004.
outbox:
  poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:2000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
