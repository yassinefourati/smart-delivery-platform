name: smart-delivery-platform

# Local development environment.
#
# Credentials below are fixed, non-secret defaults for local development only --
# they are never used outside this compose network. See docs/local-development.md.
#
# Phase 1 (foundation): infrastructure (Postgres/Kafka/Redis) + service skeletons that
# only expose /actuator/health. Business logic, database wiring, and Kafka producers/
# consumers are added service-by-service in later phases (see docs/architecture.md).
# Observability stack (Prometheus/Grafana) is introduced in the observability phase.

x-service-defaults: &service-defaults
  networks:
    - smart-delivery-net
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    container_name: sdp-postgres
    environment:
      POSTGRES_USER: sdp
      POSTGRES_PASSWORD: sdp_local_dev_only
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdp -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smart-delivery-net
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    container_name: sdp-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - smart-delivery-net
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: sdp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smart-delivery-net
    restart: unless-stopped

  # The only entry point clients are given, and since Phase 19 the only place API
  # documentation is served: http://localhost:8080/swagger-ui.html aggregates every
  # service's OpenAPI document into one UI with a service picker (docs/api-documentation.md).
  #
  # Each backend service pins its document's `servers` entry to PUBLIC_GATEWAY_URL, which
  # defaults to http://localhost:8080 -- correct here, because that is where a browser on
  # the host reaches this gateway. A real deployment behind a domain name sets it.
  api-gateway:
    <<: *service-defaults
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: sdp-api-gateway
    # Matches this service's Kubernetes memory request/limit, and it has to be here for
    # the image's JAVA_OPTS to mean anything: -XX:MaxRAMPercentage is a percentage OF THE
    # CGROUP LIMIT, and with no limit set the JVM reads the host's RAM instead -- so eight
    # containers would each size a heap from the whole laptop. Limits, not reservations:
    # Linux only backs heap pages when they are touched, so a service that uses 400MB
    # shows 400MB in `docker stats` whatever this says.
    mem_limit: 1g
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      USER_SERVICE_URI: http://user-service:8081
      PRODUCT_SERVICE_URI: http://product-service:8082
      INVENTORY_SERVICE_URI: http://inventory-service:8083
      ORDER_SERVICE_URI: http://order-service:8084
      PAYMENT_SERVICE_URI: http://payment-service:8085
      DELIVERY_SERVICE_URI: http://delivery-service:8086
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  user-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: sdp-user-service
    # The Kubernetes memory limit -- required for JAVA_OPTS; see api-gateway above.
    mem_limit: 768m
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      DB_URL: jdbc:postgresql://postgres:5432/user_db
      DB_USERNAME: sdp
      DB_PASSWORD: sdp_local_dev_only
      # No JWT_PRIVATE_KEY here on purpose: user-service generates a throwaway RSA key
      # pair at startup and logs a warning saying so (ADR 007). That is right for a local
      # Compose stack -- there is no production key to leak into a committed file -- and
      # wrong anywhere else, because tokens die with the container and a second replica
      # would sign with a different key. A real deployment mounts a PKCS#8 PEM.
      ORDER_SERVICE_CLIENT_SECRET: local-dev-only-order-service-secret
      # Creates one ADMIN account at startup so a fresh stack has somebody who can
      # administer it, and so scripts/e2e-smoke.sh has an admin to work with.
      # Local-Compose-only, like every other credential in this file; a real deployment
      # leaves these unset. See BootstrapAdminInitializer.
      BOOTSTRAP_ADMIN_EMAIL: admin@smart-delivery.local
      BOOTSTRAP_ADMIN_PASSWORD: local-dev-only-admin-password
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  product-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: sdp-product-service
    # The Kubernetes memory limit -- required for JAVA_OPTS; see api-gateway above.
    mem_limit: 1g
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      JWT_JWK_SET_URI: http://user-service:8081/.well-known/jwks.json
      DB_URL: jdbc:postgresql://postgres:5432/product_db
      DB_USERNAME: sdp
      DB_PASSWORD: sdp_local_dev_only
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  inventory-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: sdp-inventory-service
    # The Kubernetes memory limit -- required for JAVA_OPTS; see api-gateway above.
    mem_limit: 768m
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      JWT_JWK_SET_URI: http://user-service:8081/.well-known/jwks.json
      DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      DB_USERNAME: sdp
      DB_PASSWORD: sdp_local_dev_only
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  order-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: sdp-order-service
    # The Kubernetes memory limit -- required for JAVA_OPTS; see api-gateway above.
    mem_limit: 1g
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      JWT_JWK_SET_URI: http://user-service:8081/.well-known/jwks.json
      DB_URL: jdbc:postgresql://postgres:5432/order_db
      DB_USERNAME: sdp
      DB_PASSWORD: sdp_local_dev_only
      USER_SERVICE_URI: http://user-service:8081
      PRODUCT_SERVICE_URI: http://product-service:8082
      INVENTORY_SERVICE_URI: http://inventory-service:8083
      PAYMENT_SERVICE_URI: http://payment-service:8085
      # order-service's own credential at user-service's client-credentials endpoint
      # (ADR 007). Local-Compose-only, like every other credential in this file; it must
      # match user-service's ORDER_SERVICE_CLIENT_SECRET below.
      ORDER_SERVICE_CLIENT_SECRET: local-dev-only-order-service-secret
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      product-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  payment-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: sdp-payment-service
    # The Kubernetes memory limit -- required for JAVA_OPTS; see api-gateway above.
    mem_limit: 768m
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      JWT_JWK_SET_URI: http://user-service:8081/.well-known/jwks.json
      DB_URL: jdbc:postgresql://postgres:5432/payment_db
      DB_USERNAME: sdp
      DB_PASSWORD: sdp_local_dev_only
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  delivery-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: delivery-service/Dockerfile
    container_name: sdp-delivery-service
    # The Kubernetes memory limit -- required for JAVA_OPTS; see api-gateway above.
    mem_limit: 768m
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      JWT_JWK_SET_URI: http://user-service:8081/.well-known/jwks.json
      DB_URL: jdbc:postgresql://postgres:5432/delivery_db
      DB_USERNAME: sdp
      DB_PASSWORD: sdp_local_dev_only
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  notification-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: sdp-notification-service
    # The Kubernetes memory limit -- required for JAVA_OPTS; see api-gateway above.
    mem_limit: 512m
    ports:
      - "8087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8087/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # The React SPA (frontend/, docs/frontend.md). This nginx is the single origin for the
  # browser: it serves the bundle and proxies /api and /.well-known to the gateway, which is
  # why the app needs no CORS and can use connect-src 'self'. gateway-proxy.conf is mounted
  # rather than baked in because under Kubernetes the Ingress does that routing instead.
  # Port 8088 because 3000 is Grafana and 8080-8087 are the services.
  web:
    <<: *service-defaults
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sdp-web
    mem_limit: 128m
    ports:
      - "8088:8080"
    volumes:
      - ./frontend/nginx/gateway-proxy.conf:/etc/nginx/sdp/gateway-proxy.conf:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/index.html"]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: sdp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - smart-delivery-net
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.9.1
    container_name: sdp-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
      - "4318:4318"
    volumes:
      - ./infrastructure/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - smart-delivery-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.1
    container_name: sdp-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: sdp_local_dev_only
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
    networks:
      - smart-delivery-net
    restart: unless-stopped

networks:
  smart-delivery-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  tempo-data:
  grafana-data:
