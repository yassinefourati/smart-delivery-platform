# Provisioned Grafana datasources (docs/observability.md) -- checked into git rather than
# clicked together by hand, so a fresh `docker compose up` gets a working Grafana with
# both datasources wired on first boot.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
