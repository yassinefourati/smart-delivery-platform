spring:
  application:
    name: order-service
  # Kubernetes readiness (Phase 20). Each setting states its reason in a line; the
  # full argument is docs/kubernetes.md and docs/adr/010-probe-and-lifecycle-contract.md.
  lifecycle:
    # Bounds EACH shutdown phase, not the total. The pod's terminationGracePeriodSeconds
    # must cover preStop + 2 x this, and the Helm chart refuses to render if it does not.
    timeout-per-shutdown-phase: ${SHUTDOWN_PHASE_TIMEOUT:20s}
  task:
    scheduling:
      pool:
        # One thread per @Scheduled job. At the default of 1, a slow outbox batch starved the
        # cleanup job and the stuck-saga reaper entirely -- docs/kubernetes.md.
        size: ${SCHEDULER_POOL_SIZE:3}
  security:
    oauth2:
      resourceserver:
        jwt:
          # This service holds no signing key of any kind -- it fetches user-service's
          # public keys and can only verify (ADR 007, docs/security.md). A token's `kid`
          # header selects the key, so user-service can rotate without a flag day.
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
          # Validated as claims, not used for OIDC discovery: jwk-set-uri above already
          # says where the keys are, so nothing here fetches /.well-known/openid-configuration.
          issuer-uri: ${JWT_ISSUER:https://user-service.smart-delivery.local}
          # Stops a token minted for some other system that happens to trust the same
          # issuer from being replayed against this platform.
          audiences: ${JWT_AUDIENCE:smart-delivery-platform}
  http:
    client:
      # Bounds how long a single call to product-service/inventory-service/payment-service
      # can hang before it's treated as a failure -- without this, a stuck TCP connection
      # can block far longer than any Resilience4j retry/circuit-breaker setting below
      # would suggest, since none of those can act on a call that hasn't failed yet.
      connect-timeout: 2s
      read-timeout: 3s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DB_USERNAME:sdp}
    password: ${DB_PASSWORD:sdp_local_dev_only}
    # Both Hikari defaults are wrong for a pod. A 30s connection-timeout parks the same
    # request threads that serve the probes -- a restart storm even with db out of the
    # probe groups -- and 10 x 6 services x 2 replicas exceeds Postgres's 100 connections.
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:2000}
      maximum-pool-size: ${DB_POOL_MAX:5}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Migrations may run as a separate, schema-owning role while the application
    # runs as a DML-only one (deploy/helm/sdp-data, docs/security-hardening.md), so a
    # compromised pod cannot DROP or ALTER what it serves. Both default to the
    # runtime credentials, so nothing changes until DB_MIGRATION_* are set.
    user: ${DB_MIGRATION_USERNAME:${spring.datasource.username}}
    password: ${DB_MIGRATION_PASSWORD:${spring.datasource.password}}
    # Kubernetes has no depends_on, so a pod scheduled before Postgres is up would
    # crash-loop. The interval must be set with the count: Boot's default is 120s.
    connect-retries: ${FLYWAY_CONNECT_RETRIES:10}
    connect-retries-interval: ${FLYWAY_CONNECT_RETRIES_INTERVAL:5s}
    # Flyway's own default, stated because it is a cliff: replicas waiting on another's
    # migration give up after ~50s. Raise it before any migration that could run longer.
    lock-retry-count: ${FLYWAY_LOCK_RETRY_COUNT:50}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Producer/consumer values are plain JSON strings, not Java-type-headered objects --
    # see docs/kafka-events.md and OrderEventPublisher/OrderSagaEventListener. This
    # avoids the classic Spring Kafka pitfall of a consumer needing the producer's exact
    # (service-local, differently-packaged) Java class on its classpath.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: order-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      # On shutdown, stop after the current record instead of draining up to 500. The rest
      # are redelivered -- safe (idempotent consumers, ADR 002), but more duplicates per deploy.
      immediate-stop: true
      # Consumer threads per listener in this pod (Phase 23, ADR 015). A group gets at most
      # one active consumer per partition, so pods x concurrency above the topic's partition
      # count (kafka.topics.partitions) only adds idle threads. 1 here, raised by Compose and
      # the Helm chart. A thread takes a database connection only for the short transaction
      # a record needs, never while it waits on the network, so threads need not fit the
      # pool one-for-one; SdpDbPoolSaturated says when they stop fitting.
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:1}

server:
  port: 8084
  # Boot 3.5's default already; stated because the grace-period arithmetic depends on it.
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      # Two probe groups for the kubelet, with no shared dependency in either (ADR 010).
      # /actuator/health is unchanged and still aggregates db, Kafka and Redis.
      probes:
        enabled: true
      group:
        # Liveness: is this JVM wedged? Never Postgres, Kafka or Redis -- a shared outage
        # must not restart every replica at once.
        liveness:
          include: livenessState
        # Readiness: can this instance take traffic? Shared dependencies are deliberately
        # excluded; ADR 010 records which failure that choice accepts.
        readiness:
          include: readinessState
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  health:
    circuitbreakers:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: order-service
    description: Order lifecycle and Saga orchestration service

services:
  product-service:
    base-url: ${PRODUCT_SERVICE_URI:http://localhost:8082}
  inventory-service:
    base-url: ${INVENTORY_SERVICE_URI:http://localhost:8083}
  payment-service:
    base-url: ${PAYMENT_SERVICE_URI:http://localhost:8085}
  # Where order-service exchanges its own client credentials for the short-lived
  # SERVICE-role token its saga calls carry (ADR 007). Replaces the pre-Phase-16
  # arrangement where order-service signed those tokens itself with the platform-wide
  # HMAC secret. The secret below is a local-dev default and MUST be overridden per
  # environment; it is order-service's alone, so a leak does not let the holder mint an
  # ADMIN token or impersonate another service.
  user-service:
    base-url: ${USER_SERVICE_URI:http://localhost:8081}
    client-id: ${ORDER_SERVICE_CLIENT_ID:order-service}
    client-secret: ${ORDER_SERVICE_CLIENT_SECRET:local-dev-only-order-service-secret}

# Stuck-saga reaper (ADR 008). A saga whose Kafka retries are exhausted leaves its order
# in a resumable state holding stock, with nothing that would ever look at it again; this
# is what does.
saga:
  # How long an order may sit untouched in a resumable state before its saga counts as
  # stuck. Must be comfortably longer than a healthy saga takes end to end, including
  # Spring Kafka's own three retries, or the reaper races the saga it means to rescue.
  # It is also the lease the reaper's claim takes on an order.
  stuck-threshold: ${SAGA_STUCK_THRESHOLD:5m}
  # Re-runs of startSaga (idempotent, so a retry resumes rather than repeats) before the
  # reaper gives up, compensates, and marks the order FAILED. Counted per order.
  max-attempts: ${SAGA_MAX_ATTEMPTS:3}
  batch-size: ${SAGA_REAPER_BATCH_SIZE:50}
  reaper-interval-ms: ${SAGA_REAPER_INTERVAL_MS:60000}

# The transactional outbox (ADR 004) and its concurrency/retention behavior (ADR 006).
# Every value here is safe to leave alone; they exist so a deployment that publishes far
# more, or far fewer, events than this one can tune without a code change.
outbox:
  # How often OutboxPublisher claims a batch of PENDING rows.
  poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:2000}
  # Rows claimed per poll. Each is sent inside the claiming transaction, so this also
  # bounds how long that transaction holds its row locks -- see OutboxPublisher.
  batch-size: ${OUTBOX_BATCH_SIZE:50}
  # Backoff for a row that fails to publish. Retries stay unbounded (ADR 004); these
  # only stop a poison row from being retried every poll interval forever.
  initial-backoff: ${OUTBOX_INITIAL_BACKOFF:2s}
  max-backoff: ${OUTBOX_MAX_BACKOFF:5m}
  # How long a PUBLISHED row is kept before OutboxCleanupJob deletes it, and how that
  # deletion is paced. PENDING rows are never deleted, whatever their age.
  retention: ${OUTBOX_RETENTION:7d}
  cleanup-interval-ms: ${OUTBOX_CLEANUP_INTERVAL_MS:3600000}
  cleanup-batch-size: ${OUTBOX_CLEANUP_BATCH_SIZE:500}
  cleanup-max-batches-per-run: ${OUTBOX_CLEANUP_MAX_BATCHES_PER_RUN:20}

# One instance per downstream service order-service calls synchronously (docs/resilience.md)
# -- every operation against the same downstream (reserve/release/deduct for
# inventory-service; charge/refund for payment-service) shares one instance, so a
# problem with that downstream trips one breaker/bulkhead/limiter for all of them, not
# three independent ones.
resilience4j:
  circuitbreaker:
    instances:
      product-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
      inventory-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        # A 409 (insufficient stock) is a real business outcome, not a sign
        # inventory-service is unhealthy -- see InventoryServiceClient and
        # docs/resilience.md. Must not count toward opening the circuit. Same reasoning
        # for ServiceTokenUnavailableException: it is raised inside this breaker (the
        # SERVICE token is fetched on the way into the call) but means user-service is
        # unreachable, which says nothing at all about inventory-service -- see ADR 007.
        ignore-exceptions:
          - com.smartdelivery.order.exception.InsufficientStockException
          - com.smartdelivery.order.exception.ServiceTokenUnavailableException
      payment-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - com.smartdelivery.order.exception.ServiceTokenUnavailableException
  retry:
    instances:
      product-service:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
      inventory-service:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - com.smartdelivery.order.exception.InsufficientStockException
          - com.smartdelivery.order.exception.ServiceTokenUnavailableException
      payment-service:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - com.smartdelivery.order.exception.ServiceTokenUnavailableException
  bulkhead:
    instances:
      product-service:
        max-concurrent-calls: 20
      inventory-service:
        max-concurrent-calls: 20
      payment-service:
        max-concurrent-calls: 20
  ratelimiter:
    instances:
      product-service:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 500ms
      inventory-service:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 500ms
      payment-service:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 500ms

# This service still generates and serves its own OpenAPI document at /v3/api-docs --
# that is what api-gateway proxies and aggregates. What it no longer serves is a Swagger
# UI of its own: there is one UI for the whole platform, at the gateway, with a dropdown
# to switch between services (docs/api-documentation.md). Six near-identical UIs on six
# ports, each documenting an API you are not supposed to call directly, was six chances
# to read a stale one. Set springdoc.swagger-ui.enabled=true to get it back for local
# debugging against this service's own port.
springdoc:
  swagger-ui:
    enabled: false

# Metadata springdoc cannot infer, bound by platform-starter (ADR 009). public-url is the
# one that matters: it is what Swagger UI's "Try it out" calls, and it has to be the
# gateway -- a document served through the gateway would otherwise advertise this
# service's internal hostname, which resolves to nothing in a browser.
platform:
  openapi:
    title: Order Service API
    description: Order placement, tracking, and cancellation
    version: v1
    public-url: ${PUBLIC_GATEWAY_URL:http://localhost:8080}

# correlationId (see CorrelationIdFilter) on every log line -- docs/observability.md.
logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

---
# Activated via SPRING_PROFILES_ACTIVE=docker (docker-compose.yml). Structured JSON
# instead of the plain-text pattern above: queryable by a log aggregator, not just
# regex-scraped -- see docs/observability.md. Left off by default so `mvn spring-boot:run`
# and IDE runs stay human-readable.
spring:
  config:
    activate:
      on-profile: docker
logging:
  structured:
    format:
      console: ecs
